# 首次安装复制为 config.toml；也可让 MaiBot 根据配置模型生成默认配置。
[plugin]
enabled = true
config_version = "1.1.0"

[music]
default_platform = "qq"       # QQ 优先，LLM 工具失败时换网易云
command_prefix = "/"
auto_parse_url = false         # 分享链接不会默认触发语音
auto_parse_card = false
search_limit = 5
auto_select_first = true       # /点歌 直接选择最佳候选；LLM 工具始终直接尝试播放
play_mode = "voice"            # voice / card
voice_source = "local"         # local / remote；完整时长校验只在 local 模式生效
cache_storage_dir = ""        # 留空：本插件数据目录/audio_cache
cache_reader_dir = ""         # 同机留空；NapCat / SnowLuma 填各自可读的同一缓存目录
cache_max_size_mb = 1024
cache_expire_hours = 24
cache_cleanup_interval_hours = 24
cache_max_file_size_mb = 50
cache_download_timeout_seconds = 30  # 原生 MP3 下载超时；聚合源每次网络操作超时为 15 秒

[source_bridge]
enabled = true                 # 向 music.txqq.pro 发送关键词，账户 Cookie 不会发给该服务

[netease]
MUSIC_U = ""                  # 可选的平台登录凭证，只发往网易云接口
csrf_token = ""

[qq]
uin = ""                      # 原生 QQ 搜索回退需要；聚合源搜索不使用账号 Cookie
qqmusic_key = ""
