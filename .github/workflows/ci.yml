name: Validate plugin

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y -qq ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression tests
        run: python -m pytest -q -ra
      - name: Validate release sources
        run: python scripts/check_release.py
      - name: Build and inspect archive
        run: |
          python scripts/build_release.py
          python scripts/check_release.py --built
