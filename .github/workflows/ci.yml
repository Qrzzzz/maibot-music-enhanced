name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression tests
        run: python -m pytest -q -ra
      - name: Validate release sources
        run: python scripts/check_release.py
      - name: Build and inspect archive
        run: |
          python scripts/build_release.py
          python scripts/check_release.py --archive dist/maibot-music-enhanced-1.0.0.zip
